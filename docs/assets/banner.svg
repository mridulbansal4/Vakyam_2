<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Vakyam - eye-gesture communication with an on-device LLM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f1a"/>
      <stop offset="1" stop-color="#10332b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ddc97" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7cf0c0"/>
      <stop offset="1" stop-color="#1f9d6b"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <circle cx="250" cy="180" r="210" fill="url(#glow)"/>

  <!-- eye, looking up and to the right -->
  <path d="M90 180 Q250 50 410 180 Q250 310 90 180 Z" fill="#f3fbf7" stroke="#3ddc97" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="278" cy="160" r="58" fill="url(#iris)"/>
  <circle cx="278" cy="160" r="24" fill="#0b1f1a"/>
  <circle cx="294" cy="144" r="9" fill="#ffffff"/>

  <!-- the six gaze directions -->
  <g stroke="#3ddc97" stroke-width="5" stroke-linecap="round" opacity="0.75">
    <line x1="250" y1="34" x2="250" y2="10"/>
    <line x1="58" y1="180" x2="34" y2="180"/>
    <line x1="442" y1="180" x2="466" y2="180"/>
    <line x1="112" y1="76" x2="94" y2="60"/>
    <line x1="388" y1="76" x2="406" y2="60"/>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#f3fbf7">
    <text x="530" y="150" font-size="104" font-weight="700" letter-spacing="2">Vakyam</text>
    <text x="534" y="204" font-size="30" fill="#7cf0c0">वाक्यम्  ·  "sentence"</text>
    <text x="534" y="262" font-size="27" fill="#cfe9df">Eye-gesture communication for people who cannot speak or move,</text>
    <text x="534" y="298" font-size="27" fill="#cfe9df">with a language model that runs entirely on the phone.</text>
  </g>
</svg>
